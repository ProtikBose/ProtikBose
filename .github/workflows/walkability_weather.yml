name: Phoenix Walkability Weather Risk

on:
  schedule:
    - cron: "0 */2 * * *" # every 2 hours
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  update-walkability-weather:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests matplotlib

      - name: Generate walkability weather chart and report
        run: python scripts/walkability_weather.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add walkability_weather.png walkability_weather.md
          git diff --cached --quiet || git commit -m "chore: update walkability weather risk [skip ci]"
          git push
